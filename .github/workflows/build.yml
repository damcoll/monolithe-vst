name: Compilation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            configure: cmake -B build -A x64
          - name: macOS
            os: macos-latest
            configure: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        shell: bash
        run: ${{ matrix.configure }}

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4 --target Monolithe_VST3 $([ "$RUNNER_OS" = macOS ] && echo "Monolithe_AU")

      # macOS refuses unsigned code on Apple Silicon: an ad-hoc signature is enough to load it
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --deep -s - build/Monolithe_artefacts/Release/VST3/MONOLITHE.vst3 build/Monolithe_artefacts/Release/AU/MONOLITHE.component

      # pluginval (Tracktion) loads the plugin like a host would; on macOS it also runs auval on the AU
      - name: Validate
        shell: bash
        run: |
          VST3=build/Monolithe_artefacts/Release/VST3/MONOLITHE.vst3
          if [ "$RUNNER_OS" = macOS ]; then
            curl -sfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
            unzip -q pluginval.zip
            PLUGINVAL=pluginval.app/Contents/MacOS/pluginval
            mkdir -p ~/Library/Audio/Plug-Ins/Components
            cp -R build/Monolithe_artefacts/Release/AU/MONOLITHE.component ~/Library/Audio/Plug-Ins/Components/
            $PLUGINVAL --strictness-level 5 --skip-gui-tests --validate-in-process --validate ~/Library/Audio/Plug-Ins/Components/MONOLITHE.component
          else
            curl -sfL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
            unzip -q pluginval.zip
            PLUGINVAL=./pluginval.exe
          fi
          $PLUGINVAL --strictness-level 5 --skip-gui-tests --validate-in-process --validate "$VST3"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          cd build/Monolithe_artefacts/Release
          ditto -c -k --keepParent VST3/MONOLITHE.vst3 ../../../dist/MONOLITHE-macOS-VST3.zip
          ditto -c -k --keepParent AU/MONOLITHE.component ../../../dist/MONOLITHE-macOS-AU.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path build/Monolithe_artefacts/Release/VST3/MONOLITHE.vst3 -DestinationPath dist/MONOLITHE-Windows-VST3.zip

      - uses: actions/upload-artifact@v5
        with:
          name: MONOLITHE-${{ matrix.name }}
          path: dist/*.zip

  # a tag like v0.1.0 publishes the Windows and macOS zips on a GitHub Release
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "MONOLITHE $GITHUB_REF_NAME" \
            --notes "First public version: 8 voices, MACHINE section (DÉRIVE, POUSSIÈRE, ACCENT), resizable front panel.

          - Windows: MONOLITHE-Windows-VST3.zip
          - macOS: MONOLITHE-macOS-VST3.zip and MONOLITHE-macOS-AU.zip (not tested on a real Mac yet, feedback welcome)

          Installation: see the README (English / Français)."
